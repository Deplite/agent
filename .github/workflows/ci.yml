name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.26", check-latest: true }

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.26", check-latest: true }

      - run: go vet -tags=e2e ./e2e/...
      - run: go test -race -tags=e2e ./e2e/...
